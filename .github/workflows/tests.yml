name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.4)" /usr/local/bin/luac
          lua -v
      - name: Run offline tests
        run: bash tests/run_all.sh
