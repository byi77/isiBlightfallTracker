name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua 5.4
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
          sudo ln -sf "$(command -v luac5.4)" /usr/local/bin/luac
          lua -v
      - name: Run offline tests
        run: bash tests/run_all.sh
      # The game client runs Lua 5.1; the tests above run on 5.4. Syntax that
      # only exists in 5.2+ (goto, //, bit operators) must fail here.
      - name: Lua 5.1 syntax check (game client)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lua5.1
          for file in $(awk '/^[^#].*\.lua[[:space:]]*$/ { sub(/\r$/, ""); print }' isiBlightfallTracker.toc); do
            luac5.1 -p "${file}"
            echo "Lua 5.1 OK: ${file}"
          done
